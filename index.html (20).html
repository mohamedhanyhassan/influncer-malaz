<!doctype html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Coverage Of Campaigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #97EDAA;
    --surface: #F4FFF6;
    --surface-2: #E8F9EC;
    --row-alt: #EEFBEF;
    --border: #7BCB8B;
    --border-soft: #A5DDB0;
    --text: #12351C;
    --text-dim: #42644B;
    --text-faint: #5D8066;
    --amber: #FF5028;
    --amber-dim: #D94120;
    --green: #43C466;
    --green-deep: #2D7A43;
    --green-soft: rgba(67,196,102,0.14);
    --danger: #FF6363;
    --radius: 10px;
    --font-en-head: 'Space Grotesk', sans-serif;
    --font-en-body: 'Inter', -apple-system, sans-serif;
    --font-ar: 'Cairo', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-en-body);
    -webkit-font-smoothing: antialiased;
  }
  body.lang-ar { font-family: var(--font-ar); direction: rtl; }
  body.lang-ar .campaign-title, body.lang-ar h1, body.lang-ar .eyebrow,
  body.lang-ar .btn, body.lang-ar .admin-btn, body.lang-ar .lang-btn,
  body.lang-ar .modal h3, body.lang-ar .add-campaign-btn, body.lang-ar .add-row-btn { font-family: var(--font-ar); }
  body:not(.lang-ar) .campaign-title, body:not(.lang-ar) h1, body:not(.lang-ar) .eyebrow { font-family: var(--font-en-head); }

  a { color: inherit; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--border-soft);
    padding: 26px 24px 40px;
  }
  .hero::before {
    content: "";
    position: absolute;
    top: -120px; inset-inline-start: -160px;
    width: 420px; height: 420px;
    border-radius: 50%;
    border: 1px solid rgba(67,196,102,0.35);
  }
  .hero::after {
    content: "";
    position: absolute;
    top: -60px; inset-inline-start: -60px;
    width: 260px; height: 260px;
    border-radius: 50%;
    border: 1px solid rgba(255,80,40,0.25);
  }
  .hero-inner { max-width: 1100px; margin: 0 auto; position: relative; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 40px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .diamond {
    flex: none;
    width: 13px; height: 13px;
    border: 1.6px solid var(--text);
    transform: rotate(45deg);
  }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }

  .lang-btn, .admin-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12.5px;
    padding: 8px 13px;
    border-radius: 100px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .lang-btn:hover, .admin-btn:hover { color: var(--text); border-color: #444; }
  .admin-btn.on {
    color: #FFFFFF;
    background: var(--amber);
    border-color: var(--amber);
    font-weight: 600;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--green);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  body.lang-ar .eyebrow { text-transform: none; letter-spacing: 0; }
  .eyebrow .line { width: 34px; height: 1px; background: var(--green); }

  h1.hero-title {
    font-weight: 700;
    font-size: clamp(30px, 5vw, 50px);
    line-height: 1.12;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
  }
  body.lang-ar h1.hero-title { font-weight: 800; line-height: 1.3; }
  h1.hero-title .accent { color: var(--amber); }

  .hero-sub {
    color: var(--text-dim);
    font-size: 15px;
    max-width: 56ch;
    line-height: 1.6;
    margin: 0 0 30px;
  }

  .stat-row {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border-soft);
    padding-top: 22px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .stat .n {
    font-family: var(--font-en-head);
    font-size: 28px;
    font-weight: 700;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
  }
  .stat .l {
    font-size: 12px;
    color: var(--text-faint);
  }

  /* ---------- Main ---------- */
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 34px 24px 20px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-bottom: 16px;
  }

  .notice {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-inline-start: 2px solid var(--green);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 22px;
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.55;
  }
  .notice.admin-notice { border-inline-start-color: var(--amber); color: #7A321F; }

  /* ---------- Search ---------- */
  .search { position: relative; margin-bottom: 22px; }
  .search input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 12px 14px 12px 38px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s ease;
  }
  body.lang-ar .search input { padding: 12px 38px 12px 14px; }
  .search input:focus { border-color: #444; }
  .search input::placeholder { color: var(--text-faint); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }
  body.lang-ar .search svg { left: auto; right: 12px; }

  /* ---------- Campaign list ---------- */
  .campaign {
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    margin-bottom: 10px;
    background: var(--surface);
    overflow: hidden;
  }
  .campaign-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    cursor: pointer;
    user-select: none;
  }
  .campaign-head:hover { background: var(--surface-2); }
  .chev {
    flex: none;
    width: 16px; height: 16px;
    color: var(--text-dim);
    transition: transform .18s ease;
  }
  .campaign.open .chev { transform: rotate(90deg); color: var(--amber); }
  body.lang-ar .campaign.open .chev { transform: rotate(-90deg); }
  .campaign-title {
    font-weight: 600;
    font-size: 16px;
    flex: 1;
    min-width: 0;
  }
  .badge {
    font-size: 11.5px;
    padding: 3px 9px;
    border-radius: 100px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    white-space: nowrap;
  }
  .badge.sample { color: var(--amber); border-color: var(--amber-dim); background: rgba(255,80,40,0.08); }
  .head-meta { display: flex; align-items: center; gap: 8px; flex: none; }
  .head-views { font-size: 12.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; display: none; }
  @media (min-width: 620px) { .head-views { display: inline; } }

  .icon-btn {
    flex: none;
    width: 28px; height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    border: 1px solid transparent;
    color: var(--text-faint);
    background: transparent;
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border); background: var(--surface-2); }
  .icon-btn.danger:hover { color: var(--danger); border-color: #4A2222; }

  .campaign-body { display: none; }
  .campaign.open .campaign-body { display: block; }

  .table-scroll { overflow-x: auto; border-top: 1px solid var(--border-soft); }
  table { width: 100%; border-collapse: collapse; min-width: 820px; font-size: 13px; }
  thead th {
    text-align: start;
    font-weight: 600;
    color: var(--green);
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-soft);
    white-space: nowrap;
  }
  body.lang-ar thead th { letter-spacing: 0; }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; color: var(--text); }
  tbody tr:nth-child(odd) { background: var(--row-alt); }
  tbody tr:last-child td { border-bottom: none; }
  .num { font-variant-numeric: tabular-nums; color: var(--text-dim); }
  .user { color: var(--text); font-weight: 600; }
  .dash { color: var(--text-faint); }

  .chips { display: flex; gap: 5px; flex-wrap: nowrap; }
  .chip { font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 5px; white-space: nowrap; }
  .chip.instagram { background: linear-gradient(135deg,#4b1d63,#a3266b 55%,#e0724a); color: #fff; }
  .chip.tiktok { background: #101010; color: #22E4D0; box-shadow: inset 0 0 0 1px #232323, 2px 0 0 -1px #FF2E63, -2px 0 0 -1px #22E4D0; }
  .chip.snapchat { background: #FFFC00; color: #111; }
  .chip.cov { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); font-weight: 500; }

  .linkpill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px 3px 8px;
    border-radius: 100px;
    border: 1px solid var(--green);
    color: var(--green);
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
  }
  .linkpill:hover { background: var(--green-soft); }

  .row-actions { display: flex; gap: 4px; }

  .add-row-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 14px; color: var(--amber); font-size: 12.5px; font-weight: 600;
    cursor: pointer; border-top: 1px dashed var(--border-soft);
  }
  .add-row-btn:hover { background: var(--surface-2); }

  .add-campaign-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px; margin-top: 6px;
    border: 1px dashed var(--border); border-radius: var(--radius);
    color: var(--text-dim); background: transparent; font-family: inherit;
    font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .add-campaign-btn:hover { color: var(--amber); border-color: var(--amber-dim); background: rgba(255,80,40,0.05); }

  .empty-state { padding: 40px 20px; text-align: center; color: var(--text-faint); font-size: 13.5px; }

  /* ---------- Closing band ---------- */
  .closing {
    margin-top: 40px;
    background: var(--green-deep);
    color: #F4FFF6;
    padding: 26px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .closing-inner { max-width: 1100px; margin: 0 auto; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .closing .brand { color: #EAF1E7; }
  .closing .diamond { border-color: #EAF1E7; }
  .closing p { margin: 0; font-size: 13.5px; color: #DDF3E2; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(18,53,28,0.45); backdrop-filter: blur(2px);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 60px 16px; overflow-y: auto; z-index: 100;
  }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 440px; padding: 22px; }
  .modal h3 { font-size: 17px; margin: 0 0 4px; font-weight: 700; }
  .modal .sub { color: var(--text-faint); font-size: 12.5px; margin: 0 0 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .field input[type=text], .field input[type=url], .field input[type=number], .field input[type=password], .field select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 9px 11px; font-size: 13.5px; font-family: inherit; outline: none;
  }
  .field input:focus { border-color: #444; }
  .checks { display: flex; gap: 14px; flex-wrap: wrap; }
  .check-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); }
  .check-item input { accent-color: var(--amber); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .btn:hover { color: var(--text); }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #FFFFFF; }
  .btn.primary:hover { filter: brightness(1.05); }
  .modal .error { color: var(--danger); font-size: 12.5px; margin-top: -6px; margin-bottom: 10px; display: none; }
</style>
</head>

const STORAGE_KEY = "coverage_campaigns_data_v1";
const ADMIN_KEY = "coverage_campaigns_admin";
const LANG_KEY = "coverage_campaigns_lang";

function loadLocalData(){
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_CAMPAIGNS));
}

function saveLocalData(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(CAMPAIGNS)); } catch(e){}
}

let CAMPAIGNS = loadLocalData();
let isAdmin = sessionStorage.getItem(ADMIN_KEY) === "1";
let lang = localStorage.getItem(LANG_KEY) || "en";
let openIds = new Set();

function saveData(){
  saveLocalData();
  if (!cloudReady) return;
  return CLOUD_DOC.set({
    campaigns: CAMPAIGNS,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(err => {
    console.error("Cloud save failed:", err);
  });
}

function startCloudSync(){
  if (cloudSyncStarted) return;
  cloudSyncStarted = true;

  firebaseAuth.signInAnonymously()
    .then(() => {
      cloudReady = true;
      cloudUnsubscribe = CLOUD_DOC.onSnapshot(snapshot => {
        if (snapshot.exists && Array.isArray(snapshot.data().campaigns)) {
          CAMPAIGNS = snapshot.data().campaigns;
          saveLocalData();
          renderAll();
        } else {
          // First browser seeds the cloud with its existing local data.
          return CLOUD_DOC.set({
            campaigns: CAMPAIGNS,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      }, err => {
        console.error("Realtime sync failed:", err);
      });
    })
    .catch(err => {
      console.error("Firebase anonymous auth failed:", err);
    });
}

function totalViews(c){ return c.influencers.reduce((s,r) => s + (r.views||0), 0); }

function renderList(filter=""){
  const s = t();
  const q = filter.trim().toLowerCase();
  listEl.innerHTML = "";

  const filtered = CAMPAIGNS.map(c => {
    if (!q) return { campaign:c, influencers:c.influencers };
    const nameMatch = c.name.toLowerCase().includes(q);
    const influencers = nameMatch ? c.influencers : c.influencers.filter(r => r.user.toLowerCase().includes(q));
    return { campaign:c, influencers };
  }).filter(x => x.influencers.length > 0 || (!q));

  if (filtered.length === 0){
    listEl.innerHTML = `<div class="empty-state">${s.noMatch(filter)}</div>`;
    return;
  }

  filtered.forEach(({campaign, influencers}) => {
    const el = document.createElement('div');
    el.className = 'campaign' + (openIds.has(campaign.id) ? ' open' : '');
    el.innerHTML = `
      <div class="campaign-head" data-toggle="${campaign.id}">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 6 15 12 9 18"/></svg>
        <div class="campaign-title">${campaign.name}</div>
        ${campaign.sample ? `<span class="badge sample">${s.sample}</span>` : ''}
        <div class="head-meta">
          <span class="badge">${influencers.length} ${s.influencerWord(influencers.length)}</span>
          <span class="head-views">${fmt(totalViews({influencers})) || 0} ${s.views}</span>
          ${isAdmin ? `
            <button class="icon-btn" data-edit-camp="${campaign.id}" title="Rename"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
            <button class="icon-btn danger" data-del-camp="${campaign.id}" title="Delete campaign"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
          ` : ''}
        </div>
      </div>
      <div class="campaign-body">${openIds.has(campaign.id) ? renderTable(campaign) : ''}</div>
    `;
    listEl.appendChild(el);
  });

  listEl.querySelectorAll('[data-toggle]').forEach(headEl => {
    headEl.addEventListener('click', (e) => {
      if (e.target.closest('.icon-btn') || e.target.closest('a')) return;
      const id = headEl.getAttribute('data-toggle');
      const campEl = headEl.closest('.campaign');
      const bodyEl = campEl.querySelector('.campaign-body');
      const campaign = CAMPAIGNS.find(c => c.id === id);
      if (openIds.has(id)){
        openIds.delete(id); campEl.classList.remove('open'); bodyEl.innerHTML = '';
      } else {
        openIds.add(id); campEl.classList.add('open');
        bodyEl.innerHTML = renderTable(campaign);
        wireTableEvents(campaign, bodyEl);
      }
    });
  });

  listEl.querySelectorAll('[data-edit-camp]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); campaignModal(CAMPAIGNS.find(x => x.id === btn.getAttribute('data-edit-camp'))); });
  });
  listEl.querySelectorAll('[data-del-camp]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-del-camp');
      const c = CAMPAIGNS.find(x => x.id === id);
      confirmDelete(t().del.campaign(c.name), () => { CAMPAIGNS = CAMPAIGNS.filter(x => x.id !== id); saveData(); });
    });
  });

  listEl.querySelectorAll('.campaign.open').forEach(campEl => {
    const id = campEl.querySelector('[data-toggle]').getAttribute('data-toggle');
    const campaign = CAMPAIGNS.find(c => c.id === id);
    wireTableEvents(campaign, campEl.querySelector('.campaign-body'));
  });
}

function wireTableEvents(campaign, bodyEl){
  bodyEl.querySelectorAll('[data-add-inf]').forEach(btn => btn.addEventListener('click', () => influencerModal(campaign, null)));
  bodyEl.querySelectorAll('[data-edit-inf]').forEach(btn => btn.addEventListener('click', () => {
    influencerModal(campaign, campaign.influencers[Number(btn.getAttribute('data-edit-inf'))]);
  }));
  bodyEl.querySelectorAll('[data-del-inf]').forEach(btn => btn.addEventListener('click', () => {
    const idx = Number(btn.getAttribute('data-del-inf'));
    confirmDelete(t().del.influencer(campaign.influencers[idx].user), () => { campaign.influencers.splice(idx,1); saveData(); });
  }));
}

function renderStats(){
  const s = t();
  const totalCampaigns = CAMPAIGNS.length;
  const totalInfluencers = CAMPAIGNS.reduce((s,c)=>s+c.influencers.length,0);
  const totalV = CAMPAIGNS.reduce((s,c)=>s+totalViews(c),0);
  statRow.innerHTML = `
    <div class="stat"><span class="n">${totalCampaigns}</span><span class="l">${s.statCampaigns}</span></div>
    <div class="stat"><span class="n">${totalInfluencers}</span><span class="l">${s.statInfluencers}</span></div>
    <div class="stat"><span class="n">${fmt(totalV) || 0}</span><span class="l">${s.statViews}</span></div>
  `;
}

function renderNotice(){
  const s = t();
  noticeSlot.innerHTML = isAdmin
    ? `<div class="notice admin-notice">${s.noticeAdmin}</div>`
    : `<div class="notice">${s.noticeNormal}</div>`;
}

function renderAdminToggle(){
  const s = t();
  adminToggle.classList.toggle('on', isAdmin);
  adminLabel.textContent = isAdmin ? s.adminOn : s.adminOff;
  addCampaignBtn.style.display = isAdmin ? 'flex' : 'none';
  addCampaignLabel.textContent = s.addCampaign;
}

function renderStatic(){
  const s = t();
  document.getElementById('brandName').textContent = s.brand;
  document.getElementById('closingBrand').textContent = s.brand;
  document.getElementById('eyebrowText').textContent = s.eyebrow;
  document.getElementById('heroTitle').innerHTML = s.heroTitleHTML;
  document.getElementById('heroSub').textContent = s.heroSub;
  document.getElementById('closingText').textContent = s.closingText;
  searchInput.placeholder = s.searchPlaceholder;
  langToggle.textContent = s.langToggle;
  document.title = s.brand;
  htmlRoot.setAttribute('lang', lang);
  document.body.classList.toggle('lang-ar', lang === 'ar');
}

function renderAll(){
  renderStatic();
  renderNotice();
  renderAdminToggle();
  renderStats();
  renderList(searchInput.value);
}

adminToggle.addEventListener('click', () => {
  if (isAdmin){ isAdmin = false; sessionStorage.removeItem(ADMIN_KEY); renderAll(); }
  else { promptPassword(); }
});
addCampaignBtn.addEventListener('click', () => campaignModal(null));
searchInput.addEventListener('input', e => renderList(e.target.value));
langToggle.addEventListener('click', () => {
  lang = lang === 'en' ? 'ar' : 'en';
  localStorage.setItem(LANG_KEY, lang);
  renderAll();
});

renderAll();
startCloudSync();
</script>
</body>
</html>
